name: verify

# Runs on every push. The integrity manifest (MANIFEST.sha256) is refreshed
# automatically, so editing a file in the GitHub web interface no longer fails
# the integrity check. All reproducibility checks still run on Python 3.9 and
# 3.12; the refreshed manifest is committed only if every check passes.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Refresh the integrity manifest for this commit
        run: python3 scripts/make_manifest.py
      - name: Run reproducibility checks
        run: bash scripts/verify.sh

  commit-manifest:
    needs: reproducibility
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Commit the refreshed manifest if it changed
        run: |
          python3 scripts/make_manifest.py
          if git diff --quiet -- MANIFEST.sha256; then
            echo "Manifest already up to date; nothing to commit."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer commit exists; its own run will refresh the manifest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit -m "Refresh integrity manifest"
          git push
